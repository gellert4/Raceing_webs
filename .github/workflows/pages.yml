name: Deploy FLOWSTATE RACING to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: pnpm exec next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /Raceing_webs
          NEXT_PUBLIC_WAITLIST_URL: ${{ vars.WAITLIST_URL }}
          NEXT_PUBLIC_WAITLIST_ENABLED: 'false'
          NEXT_PUBLIC_CHECKOUT_ENABLED: 'false'
          NEXT_PUBLIC_WITHDRAWAL_ENABLED: 'false'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
